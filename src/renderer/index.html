<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>PlayDeck</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; font-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="cursor-hidden">
  <div id="bg">
    <div class="bg-layer"></div>
    <div class="bg-layer"></div>
    <canvas id="particles"></canvas>
    <div class="bg-shade"></div>
  </div>

  <div id="app">
    <header id="topbar">
      <div class="brand" title="PlayDeck">
        <span class="brand-mark"><i></i><i></i><i></i><i></i></span>
      </div>
      <nav class="tabs">
        <button class="tab focusable" data-group="top" data-view="home">Jogos</button>
        <button class="tab focusable" data-group="top" data-view="library">Biblioteca</button>
        <button class="tab focusable" data-group="top" data-view="collections">Coleções</button>
        <button class="tab focusable" data-group="top" data-view="trophies">Troféus</button>
      </nav>
      <div class="top-right">
        <button class="icon-btn focusable" data-group="top" data-cmd="add" title="Adicionar jogo de PC ou pasta de ROMs"></button>
        <button class="icon-btn focusable" data-group="top" data-cmd="search" title="Buscar"></button>
        <button class="icon-btn focusable" data-group="top" data-cmd="settings" title="Configurações"></button>
        <button class="icon-btn focusable" data-group="top" data-cmd="power" title="Energia"></button>
        <div class="avatar" id="top-avatar"></div>
        <div class="clock" id="clock"></div>
      </div>
    </header>

    <section id="view-home" class="view">
      <div id="chips"></div>
      <div id="row-wrap">
        <div id="row" class="focusable" data-group="row" tabindex="-1">
          <div id="row-track"></div>
          <div id="row-label"><div class="rl-title"></div><div class="rl-sub"></div></div>
        </div>
      </div>
      <div id="hero">
        <div class="hero-badge"></div>
        <h1 class="hero-title"></h1>
        <div class="hero-meta"></div>
        <div class="hero-actions">
          <button class="btn-play focusable" data-group="actions" data-cmd="play">Jogar</button>
          <button class="btn-round focusable" data-group="actions" data-cmd="favorite" title="Favorito"></button>
          <button class="btn-round focusable" data-group="actions" data-cmd="options" title="Opções"></button>
        </div>
        <div class="hero-cards"></div>
      </div>
      <div id="home-empty" class="hidden">
        <h1>Nenhum jogo encontrado</h1>
        <p>Coloque suas ROMs nas pastas configuradas (por exemplo <code>roms/ps2</code>) e busque novamente.</p>
        <div class="empty-dirs"></div>
        <div class="hero-actions">
          <button class="btn-play focusable" data-group="empty" data-cmd="rescan">Buscar jogos</button>
          <button class="btn-pill focusable" data-group="empty" data-cmd="settings">Configurações</button>
        </div>
      </div>
    </section>

    <section id="view-library" class="view hidden">
      <aside class="lib-side">
        <h2>Biblioteca de jogos</h2>
        <div id="lib-filters"></div>
      </aside>
      <div class="lib-main">
        <div class="lib-head">
          <div class="lib-title"><span id="lib-heading">Todos os jogos</span><span id="lib-count"></span></div>
          <div class="lib-tools">
            <button class="btn-pill focusable" data-group="libtools" data-cmd="sort" id="lib-sort"></button>
            <button class="btn-pill focusable" data-group="libtools" data-cmd="search" id="lib-search"></button>
          </div>
        </div>
        <div id="lib-grid"></div>
      </div>
    </section>

    <section id="view-collections" class="view hidden">
      <div class="coll-head">
        <div class="coll-title">
          <span class="coll-back hidden"></span>
          <h2 id="coll-heading">Coleções</h2>
          <span id="coll-count"></span>
        </div>
        <div class="lib-tools" id="coll-tools"></div>
      </div>
      <div id="coll-body"></div>
    </section>

    <section id="view-trophies" class="view hidden">
      <div id="tr-body"></div>
    </section>

    <section id="view-settings" class="view overlay hidden">
      <aside class="set-side">
        <h2>Configurações</h2>
        <div id="set-nav"></div>
      </aside>
      <div class="set-main">
        <div class="set-crumbs" id="set-crumbs"></div>
        <div id="set-content"></div>
      </div>
    </section>
  </div>

  <div id="hints"></div>
  <div id="toasts"></div>
  <div id="modal-layer" class="hidden"></div>
  <div id="launch-layer" class="hidden">
    <div class="launch-art"></div>
    <div class="launch-info">
      <div class="spinner"></div>
      <div class="launch-title"></div>
      <div class="launch-sub"></div>
    </div>
  </div>
  <div id="welcome" class="hidden">
    <div class="welcome-inner">
      <p class="welcome-q">Bem-vindo de volta</p>
      <div class="welcome-avatar"></div>
      <div class="welcome-name"></div>
      <p class="welcome-press"></p>
    </div>
  </div>
  <div id="boot">
    <div class="boot-logo">
      <span class="shape s1"></span><span class="shape s2"></span><span class="shape s3"></span><span class="shape s4"></span>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/focusring.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/home.js"></script>
  <script src="js/library.js"></script>
  <script src="js/collections.js"></script>
  <script src="js/trophies.js"></script>
  <script src="js/padtest.js"></script>
  <script src="js/filebrowser.js"></script>
  <script src="js/addgames.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
